worker_processes auto;
pid /tmp/nginx.pid;
error_log /var/log/recipe/error.log warn;
events { worker_connections 512; }
http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;
    server_tokens off;
    sendfile on;
    keepalive_timeout 30;
    client_max_body_size 16m;
    client_body_temp_path /tmp/client_temp;
    proxy_temp_path /tmp/proxy_temp;
    fastcgi_temp_path /tmp/fastcgi_temp;
    uwsgi_temp_path /tmp/uwsgi_temp;
    scgi_temp_path /tmp/scgi_temp;
    log_format recipe_json escape=json '{"time":"$time_iso8601","remote_addr":"$remote_addr","method":"$request_method","uri":"$uri","status":$status,"bytes":$body_bytes_sent,"request_time":$request_time,"upstream":"$upstream_addr"}';
    access_log /var/log/recipe/access.log recipe_json;
    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options SAMEORIGIN always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; font-src 'self' data:; connect-src 'self'; frame-ancestors 'self'; base-uri 'self'; form-action 'self'" always;
    map $arg_page $login_key { default ""; login $binary_remote_addr; }
    limit_req_zone $login_key zone=login:10m rate=10r/m;
    upstream recipe_backend { server app:8080; }
    upstream phpmyadmin_backend { server phpmyadmin:8080; }
    server {
        listen 8080;
        server_name _;
        location = /healthz { access_log off; return 200 'ok\n'; }
        location ~ /(?:\.|config\.php|bootstrap\.php) { deny all; }
        location / {
            limit_req zone=login burst=10 nodelay;
            proxy_pass http://recipe_backend;
            proxy_hide_header X-Powered-By;
            proxy_set_header Host $http_host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_read_timeout 60s;
        }
    }
    server {
        listen 8081;
        server_name _;
        location / {
            proxy_pass http://phpmyadmin_backend;
            proxy_set_header Host $http_host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }
    }
    server {
        listen 8090;
        server_name _;
        access_log off;
        location = /stub_status { stub_status; }
        location / { return 404; }
    }
}
